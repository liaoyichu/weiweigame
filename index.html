<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>惟惟的超级大飞机</title>
  <style>
    :root {
      --ui-bg: rgba(0, 0, 0, 0.28);
      --ui-border: rgba(255, 255, 255, 0.65);
      --ui-text: #ffffff;
      --stick: rgba(255, 255, 255, 0.9);
      --throttle: #ff5c5c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #83d4ff 0%, #b8e8ff 48%, #eaf8ff 100%);
    }

    #game-root,
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      color: var(--ui-text);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.55);
      font-size: clamp(16px, 2.2vw, 22px);
      z-index: 10;
      font-weight: 700;
      pointer-events: none;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(2px);
      line-height: 1.5;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(8, 19, 38, 0.72);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #fff;
      cursor: pointer;
      text-align: center;
      padding: 24px;
      touch-action: manipulation;
    }

    #start-screen h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 6vw, 52px);
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    #start-screen p {
      margin: 6px 0;
      font-size: clamp(18px, 3vw, 26px);
    }

    .plane-picker {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(88vw, 560px);
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .plane-option {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      padding: 14px 16px;
      color: #fff;
      text-align: left;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.09) 100%);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .plane-option strong,
    .plane-option span {
      display: block;
    }

    .plane-option strong {
      font-size: clamp(18px, 2.6vw, 24px);
      letter-spacing: 0.02em;
    }

    .plane-option span {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.84;
    }

    .plane-option.active {
      border-color: rgba(255, 241, 160, 0.95);
      background: linear-gradient(180deg, rgba(255, 232, 137, 0.3) 0%, rgba(76, 157, 255, 0.18) 100%);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.26), 0 0 0 1px rgba(255, 241, 160, 0.2);
      transform: translateY(-2px);
    }

    .plane-option:active {
      transform: scale(0.99);
    }

    #start-btn {
      margin-top: 14px;
      min-width: min(74vw, 300px);
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: clamp(18px, 3.6vw, 24px);
      font-weight: 800;
      color: #102447;
      background: linear-gradient(180deg, #fff8d8 0%, #ffe889 100%);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
      animation: start-btn-breathe 1.45s ease-in-out infinite;
      touch-action: manipulation;
      cursor: pointer;
    }

    #start-btn:active {
      transform: scale(0.98);
    }

    #start-btn:disabled {
      cursor: wait;
      opacity: 0.72;
      filter: saturate(0.72);
      animation: none;
    }

    @keyframes start-btn-breathe {
      0%,
      100% {
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32), 0 0 0 0 rgba(255, 232, 137, 0.38);
      }
      50% {
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32), 0 0 0 12px rgba(255, 232, 137, 0);
      }
    }

    .instruction {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 10px;
      color: #fff;
      width: min(92vw, 720px);
      text-align: center;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      z-index: 10;
      pointer-events: none;
      font-size: clamp(14px, 2.2vw, 19px);
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      padding: 8px 12px;
    }

    #model-loading {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(12px, 1.6vw, 15px);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.35);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.24s ease;
    }

    #model-loading.show {
      opacity: 1;
    }

    #crash-flash {
      position: absolute;
      inset: 0;
      z-index: 80;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at center, rgba(255, 246, 196, 0.92) 0%, rgba(255, 163, 67, 0.7) 24%, rgba(255, 98, 24, 0.34) 48%, rgba(0, 0, 0, 0) 74%),
        linear-gradient(180deg, rgba(255, 240, 210, 0.28) 0%, rgba(255, 119, 24, 0.18) 100%);
      mix-blend-mode: screen;
      transition: opacity 0.08s linear;
    }

    #joy,
    #throttle {
      position: absolute;
      z-index: 20;
      border: 2px solid var(--ui-border);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(2px);
    }

    #joy {
      width: clamp(108px, 22vw, 142px);
      height: clamp(108px, 22vw, 142px);
      border-radius: 50%;
      bottom: 48px;
      right: 20px;
    }

    #stick {
      position: absolute;
      width: clamp(44px, 9vw, 56px);
      height: clamp(44px, 9vw, 56px);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: var(--stick);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: transform 0.05s linear;
    }

    #throttle {
      width: clamp(54px, 12vw, 72px);
      height: clamp(180px, 36vw, 230px);
      border-radius: 28px;
      bottom: 40px;
      left: 14px;
    }

    #throttle-knob {
      position: absolute;
      left: 50%;
      width: clamp(40px, 8.5vw, 54px);
      height: clamp(40px, 8.5vw, 54px);
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 30% 30%, #ffb6b6, var(--throttle));
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
      bottom: 10px;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .plane-picker {
        grid-template-columns: 1fr;
        width: min(92vw, 460px);
      }

      #ui {
        top: 8px;
        left: 8px;
        padding: 6px 10px;
      }

      #joy {
        right: 10px;
        bottom: 56px;
      }

      #throttle {
        left: 8px;
        bottom: 50px;
      }
    }
  </style>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
</head>
<body>
  <div id="game-root"></div>

  <div id="start-screen">
    <h1>✈️ 惟惟的超级大飞机</h1>
    <p id="start-tip">先选飞机，再点开始飞行！</p>
    <div class="plane-picker" id="plane-picker">
      <button class="plane-option active" type="button" data-plane-choice="a380" aria-pressed="true">
        <strong>A380</strong>
        <span>默认机型，真实 3D 客机模型，适合直接开始飞行。</span>
      </button>
      <button class="plane-option" type="button" data-plane-choice="an225" aria-pressed="false">
        <strong>An-225 梦想号</strong>
        <span>真实 3D 货运巨机模型，六发、双垂尾、高置机翼。</span>
      </button>
    </div>
    <p style="font-size: 15px; opacity: 0.92;">左边油门加速，右边摇杆控制方向</p>
    <button id="start-btn" type="button">开始飞行</button>
  </div>

  <div id="ui">
    高度: <span id="alt">800</span><br />
    速度: <span id="spd">0</span><br />
    <span id="land-status">状态: 待命</span>
  </div>

  <div id="throttle"><div id="throttle-knob"></div></div>
  <div id="joy"><div id="stick"></div></div>
  <div id="model-loading">3D 机模加载中...</div>
  <div id="crash-flash"></div>

  <div class="instruction">左侧油门控制速度，右侧摇杆控制俯仰与滚转</div>

<script>
const DEBUG = true;
const log = (...args) => {
if (DEBUG) console.log('[PlaneGame]', ...args);
};

log('Script starting, THREE available:', !!window.THREE);
log('GLTFLoader available:', !!(window.THREE && window.THREE.GLTFLoader));

// Global error handler for debugging
window.addEventListener('error', (e) => {
console.error('[PlaneGame] Global error:', e.error);
});
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[PlaneGame] Unhandled rejection:', e.reason);
    });

    // DOM references (must be initialized at script top)
    const gameRootEl = document.getElementById('game-root');
    const startScreenEl = document.getElementById('start-screen');
    const startTipEl = document.getElementById('start-tip');
    const startBtnEl = document.getElementById('start-btn');
    const planePickerEl = document.getElementById('plane-picker');
    const planeOptionEls = Array.from(document.querySelectorAll('[data-plane-choice]'));
    const joy = document.getElementById('joy');
    const stick = document.getElementById('stick');
    const throttle = document.getElementById('throttle');
    const throttleKnob = document.getElementById('throttle-knob');
    const modelLoadingEl = document.getElementById('model-loading');
    const crashFlashEl = document.getElementById('crash-flash');
    const altEl = document.getElementById('alt');
    const spdEl = document.getElementById('spd');
    const landStatusEl = document.getElementById('land-status');

    const WORLD_RADIUS = 50000;
    const TAKEOFF_SPEED_THRESHOLD = 1.28;
    const TAKEOFF_PITCH_UP_MIN = 0.16;
    const SAFE_LANDING_SPEED = 1.28;
    const SAFE_LANDING_ROLL = 0.38;
    const SAFE_LANDING_PITCH = 0.46;
    const PLANE_COLLISION_RADIUS = 16;
    const PLANE_COLLISION_HEIGHT = 4.2;
    let gameStarted = false;
    let startPending = false;
    let takeoffPlayed = false;
    let landingState = '待命';
    let roughGroundPhase = 0;
    const crashState = {
      active: false,
      reason: '',
      timer: 0,
      restartReady: false,
      focus: new THREE.Vector3()
    };
    const crashFx = {
      flash: 0,
      shake: 0
    };

    // Three.js setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x83c8f2);
    scene.fog = new THREE.Fog(0x83c8f2, 1800, 42000);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 1, 70000);
    camera.position.set(0, 35, 120);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true,
      premultipliedAlpha: false,
      powerPreference: 'high-performance',
      logarithmicDepthBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x83c8f2, 1);
    renderer.shadowMap.enabled = false;
    if (gameRootEl) gameRootEl.appendChild(renderer.domElement);

    // Lighting: make sure the model is always visible
    const hemi = new THREE.HemisphereLight(0xffffff, 0x76a6d2, 1.05);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(240, 360, 120);
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xfff2dd, 0.45);
    fill.position.set(-180, 120, -160);
    scene.add(fill);

    // Plane model: prefer external free GLB, fallback to detailed procedural An-225
    const planeGroup = new THREE.Group();
    const planeVisual = new THREE.Group();
    planeGroup.add(planeVisual);
    let propRoot = null;
    let planeModelSource = 'procedural';

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fbff, roughness: 0.46, metalness: 0.12 });
    const blueAccentMat = new THREE.MeshStandardMaterial({ color: 0x2f73b7, roughness: 0.4, metalness: 0.11 });
    const yellowAccentMat = new THREE.MeshStandardMaterial({ color: 0xf2c53d, roughness: 0.42, metalness: 0.08 });
    const engineMat = new THREE.MeshStandardMaterial({ color: 0xd4dce8, roughness: 0.36, metalness: 0.2 });
    const intakeMat = new THREE.MeshStandardMaterial({ color: 0x203348, roughness: 0.55, metalness: 0.1 });
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, roughness: 0.86, metalness: 0.02 });
    const strutMat = new THREE.MeshStandardMaterial({ color: 0xa6afbd, roughness: 0.35, metalness: 0.45 });
    const windowMat = new THREE.MeshStandardMaterial({ color: 0x7fb4de, roughness: 0.2, metalness: 0.5 });

    function setModelLoading(text, visible = true) {
      if (!modelLoadingEl) return;
      modelLoadingEl.textContent = text;
      modelLoadingEl.classList.toggle('show', visible);
    }

    function addMirror(root, mesh, x) {
      const a = mesh.clone();
      a.position.x = -Math.abs(x);
      root.add(a);
      const b = mesh.clone();
      b.position.x = Math.abs(x);
      root.add(b);
    }

    function buildProceduralAn225(root) {
      root.clear();

      const fuselageProfile = [
        [0.06, -18.8],
        [1.5, -17.2],
        [2.55, -13.8],
        [3.05, -8.6],
        [3.25, -1.5],
        [3.05, 9.8],
        [2.55, 16.8],
        [1.15, 21.2],
        [0.08, 23.4]
      ];
      const lathePts = fuselageProfile.map(([r, y]) => new THREE.Vector2(r, y));
      const fuselageGeo = new THREE.LatheGeometry(lathePts, 42);
      fuselageGeo.rotateX(Math.PI / 2);
      const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
      root.add(fuselage);

      const noseBulgeGeo = new THREE.SphereGeometry(2.4, 26, 20);
      noseBulgeGeo.scale(1.02, 0.84, 1.1);
      noseBulgeGeo.translate(0, 0.44, -15.9);
      root.add(new THREE.Mesh(noseBulgeGeo, bodyMat));

      const humpGeo = typeof THREE.CapsuleGeometry === 'function'
        ? new THREE.CapsuleGeometry(1, 4, 10, 18)
        : new THREE.CylinderGeometry(1.08, 0.94, 6.2, 22);
      humpGeo.rotateX(Math.PI / 2);
      humpGeo.translate(0, 1.94, -9.3);
      root.add(new THREE.Mesh(humpGeo, bodyMat));

      const cockpitGlassGeo = new THREE.SphereGeometry(1.74, 24, 18);
      cockpitGlassGeo.scale(1, 0.5, 1.42);
      cockpitGlassGeo.translate(0, 2.35, -12.2);
      root.add(new THREE.Mesh(cockpitGlassGeo, windowMat));

      // High wing with slight anhedral via segmented wing panels
      const centerWing = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.5, 5.1), bodyMat);
      centerWing.position.set(0, 1.74, -1.6);
      root.add(centerWing);
      for (const side of [-1, 1]) {
        const wingInner = new THREE.Mesh(new THREE.BoxGeometry(8.7, 0.42, 4.9), bodyMat);
        wingInner.position.set(side * 9, 1.62, -1.4);
        wingInner.rotation.z = side * 0.055;
        root.add(wingInner);

        const wingOuter = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.34, 4.1), bodyMat);
        wingOuter.position.set(side * 17.3, 1.28, -1.1);
        wingOuter.rotation.z = side * 0.11;
        root.add(wingOuter);

        const wingTip = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.26, 3.4), bodyMat);
        wingTip.position.set(side * 22.4, 0.96, -0.8);
        wingTip.rotation.z = side * 0.14;
        root.add(wingTip);
      }

      // Tailplanes and twin fins
      const tailPlane = new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.32, 3.15), bodyMat);
      tailPlane.position.set(0, 2.4, 11.2);
      root.add(tailPlane);

      const finGeo = new THREE.BoxGeometry(0.42, 5.3, 3.2);
      const finLeft = new THREE.Mesh(finGeo, blueAccentMat);
      finLeft.position.set(-4.8, 5.06, 12.2);
      root.add(finLeft);
      const finRight = finLeft.clone();
      finRight.position.x = 4.8;
      root.add(finRight);

      // White-blue-yellow livery stripes
      const stripeBlue = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.18, 26.5), blueAccentMat);
      stripeBlue.position.set(1.96, 0.95, -1.2);
      addMirror(root, stripeBlue, 1.96);

      const stripeYellow = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 22.8), yellowAccentMat);
      stripeYellow.position.set(1.62, 0.74, -1.1);
      addMirror(root, stripeYellow, 1.62);

      // Six engines with pylons and fan discs
      const engineStations = [6.2, 10.4, 14.8];
      for (const sx of engineStations) {
        for (const side of [-1, 1]) {
          const x = side * sx;
          const pylon = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.75, 1.5), bodyMat);
          pylon.position.set(x, 0.9, -1.6);
          root.add(pylon);

          const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.94, 0.78, 4.2, 24), engineMat);
          nacelle.rotation.x = Math.PI / 2;
          nacelle.position.set(x, 0.28, -1.6);
          root.add(nacelle);

          const intake = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.76, 0.34, 22), intakeMat);
          intake.rotation.x = Math.PI / 2;
          intake.position.set(x, 0.28, -3.74);
          root.add(intake);

          const fan = new THREE.Mesh(new THREE.CircleGeometry(0.68, 20), new THREE.MeshBasicMaterial({ color: 0x364b60 }));
          fan.position.set(x, 0.28, -3.92);
          root.add(fan);
        }
      }

      // Windows
      for (let i = 0; i < 11; i++) {
        const z = -12 + i * 1.15;
        for (const side of [-1, 1]) {
          const win = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.17, 0.34), windowMat);
          win.position.set(side * 2.05, 1.75, z);
          root.add(win);
        }
      }

      // Landing gear: nose + body gears
      const noseStrut = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 1.2, 10), strutMat);
      noseStrut.position.set(0, -1.02, -11.7);
      root.add(noseStrut);
      for (const side of [-1, 1]) {
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.09, 8, 14), wheelMat);
        wheel.rotation.y = Math.PI / 2;
        wheel.position.set(side * 0.32, -1.63, -11.7);
        root.add(wheel);
      }

      const bodyGearZ = [2.2, 5.1, 8.2];
      for (const z of bodyGearZ) {
        for (const side of [-1, 1]) {
          const xBase = side * 2.42;
          const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.55, 10), strutMat);
          strut.position.set(xBase, -1.15, z);
          root.add(strut);
          for (let i = -1; i <= 1; i++) {
            const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.085, 8, 14), wheelMat);
            wheel.rotation.y = Math.PI / 2;
            wheel.position.set(xBase + i * 0.3, -1.95, z);
            root.add(wheel);
          }
        }
      }

      // Nose spinner-style visual feedback
      propRoot = new THREE.Group();
      propRoot.position.set(0, 0.35, -18.3);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.56, 12), strutMat);
      hub.rotation.x = Math.PI / 2;
      propRoot.add(hub);
      const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2a3441, roughness: 0.5, metalness: 0.1 });
      const bladeA = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.055, 3.1), bladeMat);
      const bladeB = bladeA.clone();
      bladeB.rotation.y = Math.PI / 2;
      propRoot.add(bladeA, bladeB);
      root.add(propRoot);
    }

    const planeConfigs = {
      a380: {
        key: 'a380',
        displayName: 'A380',
        url: 'assets/A380.glb',
        targetHorizontal: 28,
        scaleClamp: [0.05, 7.5],
        rotationY: Math.PI,
        offsetY: 0.62,
        offsetZ: -0.25,
        successText: '已加载真实 3D 机模 (A380)',
        fallbackText: 'A380 机模加载失败，已回退备用机模',
        fallbackBuilder: buildProceduralAn225,
        fallbackSource: 'fallback_a380'
      },
      an225: {
        key: 'an225',
        displayName: 'An-225 梦想号',
        url: 'assets/an225.glb',
        targetHorizontal: 30,
        scaleClamp: [0.04, 7.5],
        rotationY: 0,
        offsetY: 0.8,
        offsetZ: -0.35,
        successText: '已加载真实 3D 机模 (An-225)',
        fallbackText: 'An-225 机模加载失败，已回退程序化版本',
        fallbackBuilder: buildProceduralAn225,
        fallbackSource: 'procedural_an225'
      }
    };
    let selectedPlaneKey = 'a380';
    let activePlaneKey = 'a380';
    let planeLoading = false;

    function normalizeLoadedModel(model, config) {
      const prepared = model.clone(true);
      prepared.rotation.set(0, config.rotationY ?? Math.PI, 0);
      prepared.updateMatrixWorld(true);

      const boxRaw = new THREE.Box3().setFromObject(prepared);
      const sizeRaw = new THREE.Vector3();
      boxRaw.getSize(sizeRaw);
      const horizontalRaw = Math.max(sizeRaw.x, sizeRaw.z) || 1;
      const minScale = config.scaleClamp ? config.scaleClamp[0] : 0.05;
      const maxScale = config.scaleClamp ? config.scaleClamp[1] : 7.5;
      const scale = THREE.MathUtils.clamp((config.targetHorizontal || 28) / horizontalRaw, minScale, maxScale);
      prepared.scale.setScalar(scale);
      prepared.updateMatrixWorld(true);

      const boxScaled = new THREE.Box3().setFromObject(prepared);
      const centerScaled = new THREE.Vector3();
      boxScaled.getCenter(centerScaled);
      prepared.position.sub(centerScaled);
      prepared.updateMatrixWorld(true);

      const boxCentered = new THREE.Box3().setFromObject(prepared);
      prepared.position.y -= boxCentered.min.y;
      prepared.position.y += config.offsetY || 0;
      prepared.position.z += config.offsetZ || 0;

      prepared.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = false;
        child.receiveShadow = false;
      });
      return prepared;
    }

function loadPlaneTemplate(config, onProgress) {
  if (!THREE.GLTFLoader) {
    log('GLTFLoader not available in loadPlaneTemplate');
    return Promise.reject(new Error('GLTFLoader unavailable'));
  }
  
  if (planeTemplateCache.has(config.key)) {
    log('Using cached model for', config.key);
    return Promise.resolve(planeTemplateCache.get(config.key).clone(true));
  }
  log('Loading model from', config.url);
  return new Promise((resolve, reject) => {
    const loader = new THREE.GLTFLoader();
    log('GLTFLoader created, starting load...');
    loader.load(
          config.url,
          (gltf) => {
            log('Model loaded successfully:', gltf);
            const model = gltf.scene || (gltf.scenes && gltf.scenes[0]);
            if (!model) {
              reject(new Error('Empty glTF scene'));
              return;
            }
            const prepared = normalizeLoadedModel(model, config);
            planeTemplateCache.set(config.key, prepared);
            resolve(prepared.clone(true));
          },
          (progressEvent) => {
            if (!progressEvent || !progressEvent.total || typeof onProgress !== 'function') return;
            const p = Math.min(100, Math.round((progressEvent.loaded / progressEvent.total) * 100));
            onProgress(p);
          },
          (error) => {
            log('Loader error callback:', error);
            reject(error);
          }
        );
      });
    }

    function mountPlaneModel(modelRoot, source) {
      planeVisual.clear();
      propRoot = null;
      planeVisual.add(modelRoot);
      planeModelSource = source;
    }

    function mountPlaneFallback(config) {
      planeVisual.clear();
      propRoot = null;
      (config.fallbackBuilder || buildProceduralAn225)(planeVisual);
      planeModelSource = config.fallbackSource || 'procedural';
    }

    async function loadPlaneByKey(planeKey) {
      log('loadPlaneByKey called with:', planeKey);
      const config = planeConfigs[planeKey] || planeConfigs.a380;
      selectedPlaneKey = config.key;
      updatePlanePickerUI();
      const token = ++planeLoadToken;
      planeLoading = true;
      setStartButtonLoadingState(true);
      setModelLoading(`${config.displayName} 机模加载中 0%`, true);
      if (startTipEl && !gameStarted && !crashState.active) {
        startTipEl.textContent = `${config.displayName} 加载中...`;
      }

      try {
        log('Calling loadPlaneTemplate for', config.key);
        const modelInstance = await loadPlaneTemplate(config, (percent) => {
          if (token !== planeLoadToken) return;
          setModelLoading(`${config.displayName} 机模加载中 ${percent}%`, true);
        });
        log('loadPlaneTemplate resolved, modelInstance:', modelInstance ? 'exists' : 'null');
        if (token !== planeLoadToken) return false;
        mountPlaneModel(modelInstance, `external_${config.key}`);
        activePlaneKey = config.key;
        setModelLoading(config.successText, true);
        setTimeout(() => {
          if (token === planeLoadToken) setModelLoading('', false);
        }, 1800);
        if (startTipEl && !gameStarted && !crashState.active) {
          startTipEl.textContent = `${config.displayName} 已就绪，点开始飞行！`;
        }
        log('Loaded plane model', { plane: config.key, url: config.url });
        return true;
      } catch (err) {
        log('loadPlaneByKey error:', err);
        if (token !== planeLoadToken) return false;
        mountPlaneFallback(config);
        activePlaneKey = config.key;
        setModelLoading(config.fallbackText, true);
        setTimeout(() => {
          if (token === planeLoadToken) setModelLoading('', false);
        }, 2200);
        if (startTipEl && !gameStarted && !crashState.active) {
          startTipEl.textContent = `${config.displayName} 备用机模已就绪，点开始飞行！`;
        }
        log('Plane model load failed, fallback applied', {
          plane: config.key,
          error: err && err.message ? err.message : err
        });
        return false;
      } finally {
        if (token === planeLoadToken) {
          planeLoading = false;
          setStartButtonLoadingState(false);
          log('loadPlaneByKey finally block done, planeLoading=false');
        }
      }
    }

}

    // Audio (Web Audio API: stable, no CDN dependency)
    let audioCtx = null;

    function createNoiseBuffer(context) {
      const length = context.sampleRate * 2;
      const buffer = context.createBuffer(1, length, context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(audioCtx.destination);

      engineOscLow = audioCtx.createOscillator();
      engineOscLow.type = 'sawtooth';
      engineOscLow.frequency.value = 72;
      engineLowGain = audioCtx.createGain();
      engineLowGain.gain.value = 0.06;
      engineOscLow.connect(engineLowGain).connect(masterGain);
      engineOscLow.start();

      engineOscHigh = audioCtx.createOscillator();
      engineOscHigh.type = 'triangle';
      engineOscHigh.frequency.value = 145;
      engineHighGain = audioCtx.createGain();
      engineHighGain.gain.value = 0.02;
      engineOscHigh.connect(engineHighGain).connect(masterGain);
      engineOscHigh.start();

      // Gentle wobble for richer engine rumble
      engineLfo = audioCtx.createOscillator();
      engineLfo.type = 'sine';
      engineLfo.frequency.value = 5.2;
      engineLfoGain = audioCtx.createGain();
      engineLfoGain.gain.value = 3.8;
      engineLfo.connect(engineLfoGain);
      engineLfoGain.connect(engineOscLow.frequency);
      engineLfoGain.connect(engineOscHigh.frequency);
      engineLfo.start();

      windNoise = audioCtx.createBufferSource();
      windNoise.buffer = createNoiseBuffer(audioCtx);
      windNoise.loop = true;
      windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'highpass';
      windFilter.frequency.value = 200;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.02;
      windNoise.connect(windFilter).connect(windGain).connect(masterGain);
      windNoise.start();

      audioReady = true;
      log('Audio initialized');
    }

    function playTakeoffSound() {
      if (!audioCtx || takeoffPlayed) return;
      takeoffPlayed = true;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, audioCtx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.09, audioCtx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
      osc.connect(gain).connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.36);
      log('Takeoff sound played');
    }

    function playCrashSound() {
      if (!audioCtx || !masterGain) return;
      const now = audioCtx.currentTime;

      const boom = audioCtx.createOscillator();
      boom.type = 'sawtooth';
      boom.frequency.setValueAtTime(180, now);
      boom.frequency.exponentialRampToValueAtTime(38, now + 0.55);
      const boomGain = audioCtx.createGain();
      boomGain.gain.setValueAtTime(0.0001, now);
      boomGain.gain.exponentialRampToValueAtTime(0.24, now + 0.02);
      boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.62);
      boom.connect(boomGain).connect(masterGain);
      boom.start();
      boom.stop(now + 0.64);

      const hiss = audioCtx.createBufferSource();
      hiss.buffer = createNoiseBuffer(audioCtx);
      const hissFilter = audioCtx.createBiquadFilter();
      hissFilter.type = 'bandpass';
      hissFilter.frequency.value = 960;
      const hissGain = audioCtx.createGain();
      hissGain.gain.setValueAtTime(0.0001, now);
      hissGain.gain.exponentialRampToValueAtTime(0.12, now + 0.03);
      hissGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.44);
      hiss.connect(hissFilter).connect(hissGain).connect(masterGain);
      hiss.start();
      hiss.stop(now + 0.46);
    }

    function updateAudio() {
      if (!audioCtx || !audioReady || !masterGain) return;
      const t = audioCtx.currentTime;
      const normalizedSpeed = Math.max(0, Math.min(1, speed / 4));
      const throttleRatio = Math.max(0, Math.min(1, targetThrottle / 4));
      engineOscLow.frequency.setTargetAtTime(70 + throttleRatio * 76 + normalizedSpeed * 58, t, 0.09);
      engineOscHigh.frequency.setTargetAtTime(120 + throttleRatio * 145 + normalizedSpeed * 95, t, 0.08);
      engineLowGain.gain.setTargetAtTime(0.03 + throttleRatio * 0.1, t, 0.1);
      engineHighGain.gain.setTargetAtTime(0.01 + throttleRatio * 0.06 + normalizedSpeed * 0.03, t, 0.08);
      windFilter.frequency.setTargetAtTime(220 + normalizedSpeed * 900, t, 0.12);
      windGain.gain.setTargetAtTime(0.012 + normalizedSpeed * 0.12, t, 0.12);
      masterGain.gain.setTargetAtTime(gameStarted ? 0.35 : 0.0, t, 0.2);
    }

    function getClientXY(event) {
      if (event.touches && event.touches.length > 0) {
        return { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }
      return { x: event.clientX, y: event.clientY };
    }

    function handleJoy(event) {
      event.preventDefault();
      const rect = joy.getBoundingClientRect();
      const { x, y } = getClientXY(event);
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = x - cx;
      let dy = y - cy;
      const max = rect.width * 0.5 - stick.getBoundingClientRect().width * 0.5;
      const dist = Math.hypot(dx, dy);
      if (dist > max) {
        dx = (dx / dist) * max;
        dy = (dy / dist) * max;
      }

      joyTargetX = dx / max;
      joyTargetY = dy / max;
      stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetJoy() {
      joyActive = false;
      joyTargetX = 0;
      joyTargetY = 0;
      joyPointerId = null;
      stick.style.transform = 'translate(-50%, -50%)';
    }

    function handleThrottle(event) {
      event.preventDefault();
      const rect = throttle.getBoundingClientRect();
      const { y } = getClientXY(event);
      let localY = y - rect.top;
      localY = Math.max(25, Math.min(rect.height - 25, localY));
      const percentage = 1 - (localY - 25) / (rect.height - 50);
      const usableTrack = rect.height - throttleKnob.getBoundingClientRect().height - 20;
      throttleKnob.style.bottom = `${10 + percentage * usableTrack}px`;
      throttleInput = percentage * 4;
    }

    function syncThrottleKnob() {
      if (thrActive) return;
      const rect = throttle.getBoundingClientRect();
      const percentage = Math.max(0, Math.min(1, throttleInput / 4));
      const usableTrack = rect.height - throttleKnob.getBoundingClientRect().height - 20;
      throttleKnob.style.bottom = `${10 + percentage * usableTrack}px`;
    }

    function bindMobileControls() {
      joy.addEventListener('pointerdown', (e) => {
        if (joyPointerId !== null && joyPointerId !== e.pointerId) return;
        joyPointerId = e.pointerId;
        joyActive = true;
        joy.setPointerCapture(e.pointerId);
        handleJoy(e);
      }, { passive: false });

      joy.addEventListener('pointermove', (e) => {
        if (joyActive && joyPointerId === e.pointerId) handleJoy(e);
      }, { passive: false });

      joy.addEventListener('pointerup', (e) => {
        if (joyPointerId === e.pointerId) resetJoy();
      }, { passive: true });
      joy.addEventListener('pointercancel', (e) => {
        if (joyPointerId === e.pointerId) resetJoy();
      }, { passive: true });

      throttle.addEventListener('pointerdown', (e) => {
        if (throttlePointerId !== null && throttlePointerId !== e.pointerId) return;
        throttlePointerId = e.pointerId;
        thrActive = true;
        throttle.setPointerCapture(e.pointerId);
        handleThrottle(e);
      }, { passive: false });

      throttle.addEventListener('pointermove', (e) => {
        if (thrActive && throttlePointerId === e.pointerId) handleThrottle(e);
      }, { passive: false });

      throttle.addEventListener('pointerup', (e) => {
        if (throttlePointerId !== e.pointerId) return;
        thrActive = false;
        throttlePointerId = null;
      }, { passive: true });

      throttle.addEventListener('pointercancel', (e) => {
        if (throttlePointerId !== e.pointerId) return;
        thrActive = false;
        throttlePointerId = null;

          }

function triggerStart(event) {
log('triggerStart called, event:', event ? event.type : 'no event');
log('Current state: gameStarted=', gameStarted, 'startPending=', startPending, 'planeLoading=', planeLoading);
if (event) {
event.preventDefault();
event.stopPropagation();
}
if (gameStarted || startPending) {
log('triggerStart early return: gameStarted=', gameStarted, 'startPending=', startPending);
return;
}
if (planeLoading) {
log('triggerStart: planeLoading=true, waiting...');
if (startTipEl) startTipEl.textContent = `${planeConfigs[selectedPlaneKey].displayName} 机模加载中，请稍等...`;
return;
}
startPending = true;
log('triggerStart: calling window.startGame()');
if (startTipEl) startTipEl.textContent = '正在起飞...';
window.startGame();
}

    function applyKeyboardFallback(dt) {
      if (keys.has('ArrowUp')) joyTargetY = Math.max(-1, joyTargetY - dt * 4);
      if (keys.has('ArrowDown')) joyTargetY = Math.min(1, joyTargetY + dt * 4);
      if (keys.has('ArrowLeft')) joyTargetX = Math.max(-1, joyTargetX - dt * 4);
      if (keys.has('ArrowRight')) joyTargetX = Math.min(1, joyTargetX + dt * 4);
      if (keys.has('KeyW')) throttleInput = Math.min(4, throttleInput + dt * 2.2);
      if (keys.has('KeyS')) throttleInput = Math.max(0, throttleInput - dt * 2.2);
      if (!joyActive && !keys.has('ArrowUp') && !keys.has('ArrowDown')) joyTargetY *= 0.86;
      if (!joyActive && !keys.has('ArrowLeft') && !keys.has('ArrowRight')) joyTargetX *= 0.86;

    function spawnCrashDebris(origin, headingAngle, intensity) {
      clearCrashDebris();
      const mats = [bodyMat, blueAccentMat, yellowAccentMat, engineMat, intakeMat];
      const debrisCount = 28;
      for (let i = 0; i < debrisCount; i++) {
        const piece = new THREE.Mesh(
          Math.random() < 0.7
            ? new THREE.BoxGeometry(0.8 + Math.random() * 2.3, 0.28 + Math.random() * 0.95, 0.8 + Math.random() * 3.8)
            : new THREE.CylinderGeometry(0.18 + Math.random() * 0.62, 0.18 + Math.random() * 0.62, 0.8 + Math.random() * 2.4, 8),
          mats[i % mats.length]
        );
        piece.position.copy(origin);
        piece.position.x += (Math.random() - 0.5) * 6;
        piece.position.y += Math.random() * 2.5;
        piece.position.z += (Math.random() - 0.5) * 6;
        piece.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        crashDebrisGroup.add(piece);

        const angle = headingAngle + (Math.random() - 0.5) * 1.8;
        const burst = intensity * (0.45 + Math.random() * 0.95);
        crashDebris.push({
          mesh: piece,
          velocity: new THREE.Vector3(
            Math.sin(angle) * burst,
            8 + Math.random() * 12 + intensity * 0.14,
            -Math.cos(angle) * burst
          ),
          spin: new THREE.Vector3(
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8
          )
        });
      }
    }

    function updateCrashDebris(dt) {
      for (let i = 0; i < crashDebris.length; i++) {
        const part = crashDebris[i];
        part.velocity.y -= 20 * dt;
        part.mesh.position.addScaledVector(part.velocity, dt);
        part.mesh.rotation.x += part.spin.x * dt;
        part.mesh.rotation.y += part.spin.y * dt;
        part.mesh.rotation.z += part.spin.z * dt;
        if (part.mesh.position.y < 0.18) {
          part.mesh.position.y = 0.18;
          part.velocity.x *= 0.92;
          part.velocity.z *= 0.92;
          part.velocity.y *= -0.22;
          part.spin.multiplyScalar(0.985);
        }
      }
    }

    function updateCrashExplosion(dt) {
      for (let i = crashExplosionBursts.length - 1; i >= 0; i--) {
        const burst = crashExplosionBursts[i];
        burst.age += dt;
        const t = Math.min(1, burst.age / burst.maxAge);
        burst.mesh.scale.multiplyScalar(1 + burst.growth * dt * 0.1);
        burst.mesh.position.addScaledVector(burst.velocity, dt);
        burst.velocity.multiplyScalar(burst.drift);
        burst.velocity.y += dt * 2.6;
        if (burst.mesh.material && 'opacity' in burst.mesh.material) {
          burst.mesh.material.opacity = Math.max(0, (1 - t) * (burst.mesh.material.color && burst.mesh.material.color.getHex() === 0x2f3138 ? 0.55 : 0.95));
        }
        if (t >= 1) {
          crashExplosionGroup.remove(burst.mesh);
          crashExplosionBursts.splice(i, 1);
        }
      }
    }

    function resetFlightState() {
      clearCrashDebris();
      clearCrashExplosion();
      crashState.active = false;
      crashState.reason = '';
      crashState.timer = 0;
      crashState.restartReady = false;
      crashState.focus.set(0, 0, 0);
      crashFx.flash = 0;
      crashFx.shake = 0;

      planeVisual.visible = true;
      planeGroup.position.set(0, 6, runwayLength * 0.44);
      planeGroup.rotation.set(0, 0, 0);

      speed = 0;
      pitch = 0;
      roll = 0;
      yaw = 0;
      verticalSpeed = 0;
      targetThrottle = 0;
      throttleInput = 0;
      joyX = 0;
      joyY = 0;
      joyTargetX = 0;
      joyTargetY = 0;
      joyActive = false;
      thrActive = false;
      joyPointerId = null;
      throttlePointerId = null;
      roughGroundPhase = 0;
      takeoffPlayed = false;
      crossedTakeoffAltitude = false;
      landingState = '待命';
      syncThrottleKnob();
      if (startTipEl) startTipEl.textContent = `${planeConfigs[selectedPlaneKey].displayName} 已就绪，点开始飞行！`;
      setStartButtonLoadingState(false);
      if (landStatusEl) landStatusEl.textContent = '状态: 待命';
      if (crashFlashEl) crashFlashEl.style.opacity = '0';
    }

    function triggerCrash(reason, visualOrigin = null) {
      if (crashState.active) return;
      const crashIntensity = 18 + Math.max(0, speed) * 28 + Math.max(0, -verticalSpeed) * 3.8;
      const crashOrigin = visualOrigin ? visualOrigin.clone() : planeGroup.position.clone();
      crashState.active = true;
      crashState.reason = reason;
      crashState.timer = 0;
      crashState.restartReady = false;
      crashState.focus.copy(crashOrigin);
      gameStarted = false;
      startPending = false;
      landingState = '飞机解体';
      planeVisual.visible = false;
      spawnCrashExplosion(crashOrigin, crashIntensity);
      spawnCrashDebris(crashOrigin, yaw, crashIntensity);
      speed = 0;
      targetThrottle = 0;
      throttleInput = 0;
      joyX = 0;
      joyY = 0;
      joyTargetX = 0;
      joyTargetY = 0;
      if (landStatusEl) landStatusEl.textContent = `状态: ${landingState}`;
      if (startScreenEl) startScreenEl.style.display = 'none';
      if (startTipEl) startTipEl.textContent = `${reason}，点击重新开始`;
      setStartButtonLoadingState(false);
      camera.position.copy(crashState.focus.clone().add(new THREE.Vector3(46, 22, 52)));
      camera.lookAt(crashState.focus.clone().add(new THREE.Vector3(0, 8, 0)));
      playCrashSound();
    }

    function findBuildingImpact(position) {
      if (position.y > 220) return null;
      for (let i = 0; i < houseBounds.length; i++) {
        const house = houseBounds[i];
        if (Math.abs(position.x - house.x) > house.halfX + PLANE_COLLISION_RADIUS) continue;
        if (Math.abs(position.z - house.z) > house.halfZ + PLANE_COLLISION_RADIUS) continue;
        if (position.y > house.height + PLANE_COLLISION_HEIGHT) continue;
        return house;
      }
      return null;
    }

    function findMountainImpact(position) {
      for (let i = 0; i < mountainBounds.length; i++) {
        const mountain = mountainBounds[i];
        const dx = position.x - mountain.x;
        const dz = position.z - mountain.z;
        const sinY = Math.sin(-mountain.rotationY);
        const cosY = Math.cos(-mountain.rotationY);
        const localX = dx * cosY - dz * sinY;
        const localZ = dx * sinY + dz * cosY;
        const expandedRadiusX = mountain.radiusX + PLANE_COLLISION_RADIUS;
        const expandedRadiusZ = mountain.radiusZ + PLANE_COLLISION_RADIUS;
        const radialSq = (localX * localX) / (expandedRadiusX * expandedRadiusX) +
          (localZ * localZ) / (expandedRadiusZ * expandedRadiusZ);
        if (radialSq > 1) continue;
        const radial = Math.sqrt(radialSq);
        const slopeHeight = THREE.MathUtils.lerp(mountain.peakY, mountain.baseY, Math.min(1, radial));
        if (position.y > slopeHeight + PLANE_COLLISION_HEIGHT) continue;
        return {
          ...mountain,
          localX,
          localZ,
          radial,
          radialSq,
          slopeHeight,
          hitHeight: slopeHeight + PLANE_COLLISION_HEIGHT
        };
      }
      return null;
    }

    function update(dt) {
      applyKeyboardFallback(dt);
      joyX += (joyTargetX - joyX) * Math.min(1, dt * 14);
      joyY += (joyTargetY - joyY) * Math.min(1, dt * 14);
      targetThrottle += (throttleInput - targetThrottle) * Math.min(1, dt * 8);
      syncThrottleKnob();

      for (let i = 0; i < cars.length; i++) {
        const carState = cars[i];
        if (!carState.moving) continue;
        carState.mesh.position.x += Math.sin(carState.heading) * carState.velocity * dt;
        carState.mesh.position.z += Math.cos(carState.heading) * carState.velocity * dt;
        if (Math.abs(carState.mesh.position.x) > 24000 || Math.abs(carState.mesh.position.z) > 24000) {
          carState.heading += Math.PI + (Math.random() - 0.5) * 0.45;
          carState.mesh.rotation.y = carState.heading;
        }
      }

      if (gameStarted) {
        const prevPlaneY = planeGroup.position.y;
        const pitchInputUp = -joyY;
        speed += (targetThrottle - speed) * dt * 1.9;
        pitch += joyY * dt * 2.4;
        roll += joyX * dt * 3.5;
        if (propRoot) propRoot.rotation.z += dt * (8 + targetThrottle * 60);

        pitch *= 0.955;
        roll *= 0.94;
        yaw -= roll * dt * 0.58;

        planeGroup.rotation.set(-pitch, yaw, -roll, 'YXZ');

        const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(planeGroup.quaternion);
        planeGroup.position.addScaledVector(direction, speed * 95 * dt);

        const nearGround = planeGroup.position.y < 9;
        const onRunway = isOverRunway(planeGroup.position.x, planeGroup.position.z);
        const takeoffAssist = nearGround && onRunway && speed > TAKEOFF_SPEED_THRESHOLD && pitchInputUp > TAKEOFF_PITCH_UP_MIN;
        let lift = -0.78 + speed * 0.48;
        if (nearGround && onRunway) {
          if (takeoffAssist) {
            lift += 0.95;
          } else {
            // Keep wheels on runway unless pilot pulls up with enough speed.
            lift = Math.min(lift, -0.12);
          }
        }
        planeGroup.position.y += lift * 24 * dt;
        verticalSpeed = (planeGroup.position.y - prevPlaneY) / Math.max(dt, 1e-4);

        const groundMinY = 1.2;
        const buildingHit = findBuildingImpact(planeGroup.position);
        if (buildingHit) {
          const sideX = planeGroup.position.x >= buildingHit.x ? 1 : -1;
          const sideZ = planeGroup.position.z >= buildingHit.z ? 1 : -1;
          const visualOrigin = new THREE.Vector3(
            buildingHit.x + sideX * (buildingHit.halfX + 12),
            Math.min(buildingHit.height * 0.72, planeGroup.position.y + 10),
            buildingHit.z + sideZ * (buildingHit.halfZ + 12)
          );
          triggerCrash('撞上建筑，飞机解体了', visualOrigin);
        }
        const mountainHit = !crashState.active ? findMountainImpact(planeGroup.position) : null;
        if (mountainHit) {
          const outwardLocal = new THREE.Vector2(
            mountainHit.localX / Math.max(mountainHit.radiusX, 1),
            mountainHit.localZ / Math.max(mountainHit.radiusZ, 1)
          );
          if (outwardLocal.lengthSq() < 1e-4) outwardLocal.set(1, 0);
          outwardLocal.normalize();
          const surfaceLocalX = outwardLocal.x * mountainHit.radiusX * 0.84;
          const surfaceLocalZ = outwardLocal.y * mountainHit.radiusZ * 0.84;
          const sinY = Math.sin(mountainHit.rotationY);
          const cosY = Math.cos(mountainHit.rotationY);
          const surfaceWorldX = surfaceLocalX * cosY - surfaceLocalZ * sinY;
          const surfaceWorldZ = surfaceLocalX * sinY + surfaceLocalZ * cosY;
          const visualOrigin = new THREE.Vector3(
            mountainHit.x + surfaceWorldX,
            Math.min(mountainHit.slopeHeight + 80, planeGroup.position.y + 40),
            mountainHit.z + surfaceWorldZ
          );
          triggerCrash('撞上山体，飞机解体了', visualOrigin);
        }

        if (!crashState.active && planeGroup.position.y < groundMinY) {
          const hardDescent = verticalSpeed < -4.4;
          const unsafeRoll = Math.abs(roll) > SAFE_LANDING_ROLL;
          const unsafePitch = Math.abs(pitch) > SAFE_LANDING_PITCH;
          const runwayTooFast = speed > SAFE_LANDING_SPEED;
          const unstableRunwayTouchdown = speed > 0.55 && (hardDescent || unsafeRoll || unsafePitch);
          const shouldCrashOnGround = !onRunway || runwayTooFast || unstableRunwayTouchdown;
          planeGroup.position.y = groundMinY;
          if (shouldCrashOnGround) {
            triggerCrash(onRunway ? '硬着陆坠毁，飞机解体了' : '撞向地面，飞机解体了');
          } else {
            pitch = Math.min(0, pitch);
          }
        }

        if (crashState.active) {
          verticalSpeed = 0;
        } else if (nearGround) {
          if (onRunway) {
            const requestingPower = keys.has('KeyW') || thrActive || throttleInput > 1.0;
            const takeoffRun = requestingPower;
            if (takeoffRun) {
              speed *= 1 - Math.min(0.08, dt * 0.1);
              if (speed > TAKEOFF_SPEED_THRESHOLD && pitchInputUp <= TAKEOFF_PITCH_UP_MIN) {
                landingState = '抬头才能起飞';
              } else {
                landingState = takeoffAssist ? '起飞中' : '跑道加速滑跑';
              }
            } else {
              speed = THREE.MathUtils.lerp(speed, 0, Math.min(1, dt * 3.8));
              if (throttleInput > 0.4) throttleInput = Math.max(0.4, throttleInput - dt * 2.6);
              landingState = '跑道滑跑减速';
            }
            pitch *= 0.9;
            roll *= 0.9;
          } else {
            roughGroundPhase += dt * 14;
            planeGroup.position.y = groundMinY + 0.55 + Math.abs(Math.sin(roughGroundPhase)) * 0.75;
            speed = Math.max(0.65, speed * (1 - Math.min(0.55, dt * 2.2)));
            targetThrottle = Math.max(targetThrottle, 0.75);
            roll += (Math.sin(roughGroundPhase * 0.5) * 0.02);
            landingState = '非跑道低空阻力';
            if (startTipEl) startTipEl.textContent = '请对准跑道降落';
          }
        } else {
          landingState = '飞行中';
        }
        if (landStatusEl) landStatusEl.textContent = `状态: ${landingState}`;

        if (!crashState.active && !takeoffPlayed && speed > 1.2 && planeGroup.position.y > 30) {
          playTakeoffSound();
          crossedTakeoffAltitude = true;
        } else if (!crashState.active && !crossedTakeoffAltitude && planeGroup.position.y > 30) {
          crossedTakeoffAltitude = true;
          playTakeoffSound();
        }

        if (!crashState.active) {
          // World edge wrapping for endless map
          if (planeGroup.position.x > WORLD_RADIUS) planeGroup.position.x = -WORLD_RADIUS;
          if (planeGroup.position.x < -WORLD_RADIUS) planeGroup.position.x = WORLD_RADIUS;
          if (planeGroup.position.z > WORLD_RADIUS) planeGroup.position.z = -WORLD_RADIUS;
          if (planeGroup.position.z < -WORLD_RADIUS) planeGroup.position.z = WORLD_RADIUS;
        }
      } else {
        verticalSpeed = 0;
      }

      if (crashState.active) {
        crashState.timer += dt;
        updateCrashDebris(dt);
        updateCrashExplosion(dt);
        crashFx.flash = Math.max(0, crashFx.flash - dt * 1.7);
        crashFx.shake = Math.max(0, crashFx.shake - dt * 1.8);
        if (crashFlashEl) crashFlashEl.style.opacity = String(Math.min(1, crashFx.flash * 0.95));
        if (!crashState.restartReady && crashState.timer > 1.15) {
          crashState.restartReady = true;
          if (startScreenEl) startScreenEl.style.display = 'flex';
        }
      } else {
        if (crashExplosionBursts.length) updateCrashExplosion(dt);
        crashFx.flash = Math.max(0, crashFx.flash - dt * 2.4);
        crashFx.shake = Math.max(0, crashFx.shake - dt * 2.8);
        if (crashFlashEl) crashFlashEl.style.opacity = String(Math.min(1, crashFx.flash * 0.7));
      }

      updateAudio();

      const baseFocus = crashState.active ? crashState.focus : planeGroup.position;
      const nearGroundCameraOffset = new THREE.Vector3(0, 22, 78).applyQuaternion(planeGroup.quaternion);
      const flightCameraOffset = new THREE.Vector3(0, 11, 34).applyQuaternion(planeGroup.quaternion);
      const cameraOffset = crashState.active
        ? new THREE.Vector3(46, 22, 52)
        : (planeGroup.position.y < 28 ? nearGroundCameraOffset : flightCameraOffset);
      const cameraTarget = baseFocus.clone().add(cameraOffset);
      const shakeMagnitude = crashFx.shake * (2.2 + Math.sin((crashState.timer + 1) * 55) * 0.8);
      const shakeOffset = new THREE.Vector3(
        (Math.random() - 0.5) * shakeMagnitude,
        (Math.random() - 0.5) * shakeMagnitude * 0.6,
        (Math.random() - 0.5) * shakeMagnitude
      );
      camera.position.lerp(cameraTarget.clone().add(shakeOffset), 0.1);
      camera.lookAt(baseFocus.clone().add(new THREE.Vector3(shakeOffset.x * 0.25, crashState.active ? 9 + shakeOffset.y * 0.2 : 2 + shakeOffset.y * 0.2, shakeOffset.z * 0.25)));

      altEl.textContent = String(Math.max(0, Math.floor(planeGroup.position.y * 10)));
      spdEl.textContent = String(Math.max(0, Math.floor(speed * 320)));
    }

    function render() {
      renderer.render(scene, camera);
    }

    let lastTs = performance.now();
    let debugAccumulator = 0;
    let rafId = 0;
    function frame(ts) {
      const dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;

      update(dt);
      render();

      debugAccumulator += dt;
      if (debugAccumulator > 2.5) {
        debugAccumulator = 0;
        log('frame', {
          started: gameStarted,
          planePos: planeGroup.position.toArray().map((n) => Number(n.toFixed(2))),
          speed: Number(speed.toFixed(2)),
          throttle: Number(targetThrottle.toFixed(2)),
          joyX: Number(joyX.toFixed(2)),
          joyY: Number(joyY.toFixed(2))
        });
      }

      rafId = requestAnimationFrame(frame);
    }

    window.advanceTime = (ms) => {
      const step = 1000 / 60;
      const ticks = Math.max(1, Math.round(ms / step));
      for (let i = 0; i < ticks; i++) update(step / 1000);
      render();
    };

    window.render_game_to_text = () => {
      const payload = {
        coordinate: 'origin at scene center; x right, y up, z toward camera positive',
        started: gameStarted,
        worldRadius: WORLD_RADIUS,
        fullscreen: Boolean(document.fullscreenElement),
        plane: {
          selectedKey: selectedPlaneKey,
          activeKey: activePlaneKey,
          selectedName: planeConfigs[selectedPlaneKey].displayName,
          modelSource: planeModelSource,
          x: Number(planeGroup.position.x.toFixed(1)),
          y: Number(planeGroup.position.y.toFixed(1)),
          z: Number(planeGroup.position.z.toFixed(1)),
          pitch: Number(pitch.toFixed(2)),
          roll: Number(roll.toFixed(2)),
          yaw: Number(yaw.toFixed(2))
        },
        control: {
          speed: Number(speed.toFixed(2)),
          throttle: Number(targetThrottle.toFixed(2)),
          throttleInput: Number(throttleInput.toFixed(2)),
          joyX: Number(joyX.toFixed(2)),
          joyY: Number(joyY.toFixed(2)),
          joyTargetX: Number(joyTargetX.toFixed(2)),
          joyTargetY: Number(joyTargetY.toFixed(2))
        },
        landingState,
        onRunway: isOverRunway(planeGroup.position.x, planeGroup.position.z),
        audio: {
          ready: audioReady,
          contextState: audioCtx ? audioCtx.state : 'none',
          takeoffPlayed,
          engineLowHz: engineOscLow ? Number(engineOscLow.frequency.value.toFixed(2)) : 0,
          engineHighHz: engineOscHigh ? Number(engineOscHigh.frequency.value.toFixed(2)) : 0,
          windHz: windFilter ? Number(windFilter.frequency.value.toFixed(2)) : 0,
          windGain: windGain ? Number(windGain.gain.value.toFixed(4)) : 0
        },
        crash: {
          active: crashState.active,
          reason: crashState.reason,
          restartReady: crashState.restartReady,
          timer: Number(crashState.timer.toFixed(2)),
          debrisCount: crashDebris.length,
          verticalSpeed: Number(verticalSpeed.toFixed(2)),
          flash: Number(crashFx.flash.toFixed(2)),
          shake: Number(crashFx.shake.toFixed(2)),
          explosionCount: crashExplosionBursts.length
        },
        modelLoading: {
          pendingPlaneKey: selectedPlaneKey,
          loading: planeLoading,
          visible: Boolean(modelLoadingEl && modelLoadingEl.classList.contains('show')),
          text: modelLoadingEl ? modelLoadingEl.textContent : ''
        }
      };
      return JSON.stringify(payload);
    };

    window.__debugFlight = {
      resetFlightState,
      setPlaneState(next = {}) {
        if (typeof next.x === 'number') planeGroup.position.x = next.x;
        if (typeof next.y === 'number') planeGroup.position.y = next.y;
        if (typeof next.z === 'number') planeGroup.position.z = next.z;
        if (typeof next.pitch === 'number') pitch = next.pitch;
        if (typeof next.roll === 'number') roll = next.roll;
        if (typeof next.yaw === 'number') yaw = next.yaw;
        if (typeof next.speed === 'number') speed = next.speed;
        if (typeof next.throttle === 'number') {
          throttleInput = next.throttle;
          targetThrottle = next.throttle;
          syncThrottleKnob();
        }
      },
      nearestBuilding() {
        const hit = findBuildingImpact(planeGroup.position);
        return hit ? { ...hit } : null;
      },
      sampleBuilding(index = 0) {
        const house = houseBounds[((index % houseBounds.length) + houseBounds.length) % houseBounds.length];
        return house ? { ...house } : null;
      },
      sampleMountain(index = 0) {
        const mountain = mountainBounds[((index % mountainBounds.length) + mountainBounds.length) % mountainBounds.length];
        return mountain ? { ...mountain } : null;
      },
      isPlaneLoading() {
        return planeLoading;
      },
      async selectPlane(key) {
        await loadPlaneByKey(key);
        return {
          selectedKey: selectedPlaneKey,
          activeKey: activePlaneKey,
          modelSource: planeModelSource
        };
      }
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      log('resize', window.innerWidth, window.innerHeight);
    });

    log('Scene initialized', {
      camera: camera.position.toArray(),
      plane: planeGroup.position.toArray(),
      lights: 3
    });

    window.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        lastTs = performance.now();
      }
    });

    rafId = requestAnimationFrame(frame);
  </script>
</body>
</html>
